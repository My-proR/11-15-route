name: ci
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_HOST_AUTH_METHOD: trust }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check app tests
      - run: pip-audit -r requirements.txt
      - run: python -m pytest -q
        env: { TEST_DATABASE_ADMIN_URL: "postgresql://postgres@localhost:5433/postgres" }
      - name: Supabase SQL export is up to date
        working-directory: .
        run: bash scripts/export_supabase_sql.sh && git diff --exit-code supabase/migrations
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - name: npm audit (informational; known transitive build-tool advisory in expo/metro `braces`)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: apps/mobile/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: npm audit (informational; known transitive build-tool advisory in expo/metro `braces`)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
